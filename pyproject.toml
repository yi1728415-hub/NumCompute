[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.2.0"
description = "NumCompute (Assignment 2.1) and NumCompute-Stream, a decision-tree streaming ML framework (Assignment 2.2)."
authors = [
    {name = "Hongyu Liu"},
    {name = "Yi Su"},
    {name = "Wenxuan Xue"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["jupyterlab>=4", "nbconvert>=7", "nbformat>=5", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["numcompute*", "numcompute_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
